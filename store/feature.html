<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:1024px;height:500px;overflow:hidden;
 font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif}
*{box-sizing:border-box}
.wrap{width:1024px;height:500px;position:relative;display:flex;align-items:center;color:#fff;
 background:linear-gradient(115deg,#0A2E8C 0%,#1466FF 58%,#2E7BFF 100%)}
.text{padding:0 64px;max-width:640px;z-index:2}
.title{font-size:94px;font-weight:800;letter-spacing:-1px;margin:0;line-height:1}
.tag{font-size:33px;font-weight:500;margin:24px 0 0;color:#dde8ff;line-height:1.35}
.pills{margin-top:32px;display:flex;gap:16px}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
 padding:11px 20px;border-radius:999px;font-size:23px;font-weight:600}
.art{position:absolute;right:40px;top:0;height:500px;width:420px;display:flex;align-items:center;justify-content:center}
.disc{width:360px;height:360px;border-radius:50%;
 background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.22),rgba(255,255,255,.03));
 display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="wrap">
 <div class="text">
  <h1 class="title">CoDriver&nbsp;AI</h1>
  <p class="tag">Your hands-free AI copilot — talk to it while you drive, and it reads the answer back.</p>
  <div class="pills"><div class="pill">Voice in &amp; out</div><div class="pill">OpenAI &middot; Claude</div></div>
 </div>
 <div class="art"><div class="disc">
  <svg width="196" height="196" viewBox="0 0 100 100">
   <rect x="40" y="16" width="20" height="46" rx="10" fill="#fff"/>
   <path d="M27 50 a23 23 0 0 0 46 0" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
   <line x1="50" y1="73" x2="50" y2="86" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
   <line x1="35" y1="86" x2="65" y2="86" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
  </svg>
 </div></div>
</div></body></html>
