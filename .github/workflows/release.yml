name: Release to Google Play (internal)

# Trigger a release by pushing a tag like v1.3, or run it manually from the
# Actions tab. CI builds the signed AAB and uploads it to the Internal testing
# track. Requires the repo secrets described in RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name (e.g. 1.3). Optional."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Skip the action's default `tools platform-tools` install: the
          # obsolete `tools` package was removed from the SDK repo, so
          # `sdkmanager tools` fails the job. We install what we need below.
          packages: ""

      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode & verify upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Strip any stray whitespace a copy/paste may have added, then decode.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > upload-keystore.jks
          echo "Decoded keystore: $(wc -c < upload-keystore.jks) bytes"
          # Fail fast with a clear message if the secret didn't rebuild a valid keystore.
          if ! keytool -list -keystore upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::upload-keystore.jks is invalid. KEYSTORE_BASE64 is corrupt/truncated or KEYSTORE_PASSWORD is wrong. Recreate KEYSTORE_BASE64 from 'base64 -w0 upload-keystore.jks' (one line, no spaces)."
            exit 1
          fi
          echo "Upload keystore verified OK"

      - name: Write keystore.properties
        run: |
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Resolve version name
        id: ver
        run: |
          NAME="${{ github.event.inputs.versionName }}"
          if [ -z "$NAME" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          fi
          [ -z "$NAME" ] && NAME="1.2"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compute version code
        id: vc
        # GitHub Actions expressions have no arithmetic, so add in the shell.
        # Auto-incrementing and always above the manual uploads (<=100).
        run: echo "code=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB
        run: ./gradlew bundleRelease --no-daemon
        env:
          VERSION_CODE: ${{ steps.vc.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}

      - name: Upload to Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aviramj.codriver
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
